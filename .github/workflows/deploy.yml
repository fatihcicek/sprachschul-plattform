# Pull Requests: prüfen (Typprüfung, Tests, Paket bauen). Ohne grüne Prüfung kein Merge.
# Nach dem Merge auf main: zusätzlich das Paket auf den Zweig "deploy" legen.
# Der Server (Namecheap) holt sich diesen Zweig alle 5 Minuten selbst ab.
name: Prüfen und ausliefern

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kurswerk:kurswerk@localhost:5432/kurswerk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Die Anwendung verbindet sich wie im Betrieb ohne Superuser-Rechte,
      # sonst würde die Zeilensicherheit umgangen.
      - name: Datenbankrolle ohne Superuser anlegen
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE ROLE kurswerk LOGIN CREATEDB PASSWORD 'kurswerk'"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE kurswerk OWNER kurswerk"
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: ./scripts/bundle.sh
      - name: Paket auf den Zweig deploy legen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A -f
          git commit -q -m "Paket aus ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
