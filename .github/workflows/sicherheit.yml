# Sicherheitsprüfungen, getrennt vom Ausliefern (deploy.yml). Diese Datei liefert nichts aus und
# schreibt nichts: nur Lesezugriff. Die Aktionen sind auf feste Commits festgelegt (Version im Kommentar),
# damit ein verschobenes Tag keinen fremden Code einschleusen kann.
name: Sicherheitsprüfungen

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # montags: neue Meldungen zu Abhängigkeiten und die ganze Historie erneut prüfen
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sicherheit-${{ github.ref }}
  # Nur bei Pull Requests abbrechen: ein neuer Push ersetzt den alten Lauf. Auf main darf nie ein Lauf ausfallen.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  geheimnisse:
    name: Geheimnissuche (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      # TEMPORÄR (wird im nächsten Commit entfernt): einmalige Prüfung der ganzen Historie, geschwärzt.
      - name: Einmalige Vollprüfung der Historie
        if: always()
        run: /tmp/gitleaks-8.24.3/gitleaks detect --config .gitleaks.toml --redact -v --exit-code=0 --no-banner --report-format=json --report-path=/tmp/full.json || true
      - name: Ergebnis der Vollprüfung (nur Anzahl, Regel, Datei, Commit)
        if: always()
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/full.json"))
          print("Funde in der gesamten Historie:", len(r))
          for f in r: print(f["RuleID"], f["File"], f["StartLine"], f["Commit"][:8])
          PY

  abhaengigkeiten:
    name: Abhängigkeiten (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Nur Pakete, die im Betrieb laufen; hohe und kritische Meldungen brechen ab.
      - run: npm audit --omit=dev --audit-level=high

  migrationen:
    name: Migrationen unverändert
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bereits übernommene Migrationen dürfen sich nicht ändern
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-migrations-unchanged.sh "origin/${BASE_REF}"
