# Einstellungen der Geheimnissuche. Die Standardregeln von gitleaks bleiben vollständig aktiv.
title = "Kurswerk"

[extend]
useDefault = true

# Nur ausdrücklich bekannte, erfundene Testwerte ausnehmen. Jede Ausnahme gehört hier mit Begründung hin,
# nie pauschal ganze Ordner.
[allowlist]
description = "Erfundene Werte für Tests und Entwicklung"
regexes = [
  '''test-geheimnis-0123456789''',               # Testschlüssel in tests/
  '''entwicklung-nur-lokal-bitte-ersetzen''',     # Platzhalter in .env.example, in Produktion abgelehnt
]
paths = [
  '''(^|/)package-lock\.json$''',
]

# Next.js erzeugt bei jedem Build zufällige Schlüssel (Vorschau-Modus, Verschlüsselung der Serveraktionen) und legt sie
# ins Paket. Das Paket liegt auf dem Zweig "deploy". Diese Werte sind keine Zugangsdaten zu fremden Diensten, aber sie
# dürfen nicht öffentlich sein: Darum ist das Repository privat. Nur diese drei Dateien, nur diese eine Regel.
[[allowlists]]
description = "Zufällige Build-Schlüssel von Next.js im Paket auf dem Zweig deploy"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)\.next/prerender-manifest\.json$''',
  '''(^|/)\.next/server/preview-props\.json$''',
  '''(^|/)\.next/server/server-reference-manifest\.json$''',
]
